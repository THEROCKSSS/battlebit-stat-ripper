{% extends "base.html" %}
{% block title %}Create account — BattleBit Profiles{% endblock %}
{% block content %}

<div class="auth-wrap">
  <form class="card auth-card" method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <p class="kicker">Account / new</p>
    <h1>Create your account</h1>
    <p class="muted">One account holds one or more player records. Email is not required.</p>

    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" required minlength="3" maxlength="24"
             pattern="[A-Za-z0-9_]{3,24}" value="{{ request.form.get('username', '') }}">
      <small class="muted">3-24 characters: letters, numbers, underscore.</small>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
      <small class="muted">At least 8 characters.</small>
    </label>
    <label class="field">
      <span>Confirm password</span>
      <input type="password" name="confirm" autocomplete="new-password" required minlength="8">
    </label>

    <button class="button button-primary wide" type="submit">Create account</button>
    <p class="auth-alt muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
  </form>
</div>

{% endblock %}
