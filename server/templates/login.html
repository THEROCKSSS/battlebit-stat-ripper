{% extends "base.html" %}
{% block title %}Sign in — BattleBit Profiles{% endblock %}
{% block content %}

<div class="auth-wrap">
  <form class="card auth-card" method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <p class="kicker">Account / sign in</p>
    <h1>Sign in</h1>
    <p class="muted">Use the local account you created for this site.</p>



    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" required value="{{ request.form.get('username', '') }}">
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button class="button button-primary wide" type="submit">Sign in</button>
    <p class="auth-alt muted">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
  </form>
</div>

{% endblock %}
